version: '3.8'

networks:
  jira-bot-network:
    name: jira-telegram-bot-network
    external: true
  


services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_bot
    image: jira_telegram_bot:v3
    volumes:
      - .:/app
    command: >
      python3 jira_telegram_bot
    restart: always
  
  synth-pm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synth_pm_api
    image: jira_telegram_bot:v3
    volumes:
      - .:/app
    command: >
      python3 jira_telegram_bot/frameworks/api/main.py
    restart: always
    ports:
      - "2318:2318"

  ticketing-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketing_bot
    volumes:
      - .:/app
    command: >
      python3 jira_telegram_bot/frameworks/fast_api/create_ticket.py
    restart: always
    ports:
      - "2315:2315"


  jira-sync-service: # Sync Jira to PostGres Table every 10 minutes
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jira_sync_service
    image: jira_telegram_bot:v3
    volumes:
      - .:/app
    command: >
      python3 scripts/sync/run_scheduled_sync.py
    restart: always
    environment:
      - SYNC_INTERVAL_MINUTES=10
      - SYNC_PROJECT_KEYS=${SYNC_PROJECT_KEYS:-[]}
      - SYNC_FULL_SYNC=true
      - db_port=5432
      - db_host=postgres
    networks:
      - jira-bot-network

  synth-pm-multi-project-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synth_pm_multi_project
    image: jira_telegram_bot:v3
    volumes:
      - .:/app
    command: >
      python3 scripts/notifications/run_synth_pm_service.py
    restart: always
    environment:
      # Comma-separated project keys or JSON array: ["PROJECT1","PROJECT2"]
      # Leave empty to sync all projects
      - SYNTH_PM_PROJECT_KEYS=
    networks:
      - jira-bot-network

  # deadline-notifier-service:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: deadline_notifier
  #   image: jira_telegram_bot:v3
  #   volumes:
  #     - .:/app
  #   command: >
  #     python3 scripts/notifications/run_deadline_notifier.py
  #   restart: always
  #   networks:
  #     - jira-bot-network

  scheduled-reports-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scheduled_reports
    image: jira_telegram_bot:v3
    volumes:
      - .:/app
    command: >
      python3 scripts/reports/run_scheduled_reports.py
    restart: always
    networks:
      - jira-bot-network

