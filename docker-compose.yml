  ticketing-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketing_bot
    volumes:
      - .:/app
    command: >
      python3 jira_telegram_bot/frameworks/fast_api/create_ticket.py
    restart: always
    ports:
      - "2315:2315"


  jira-sync-service: # Sync Jira to PostGres Table every 10 minutes
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jira_sync_service
    image: jira_telegram_bot:v3
    volumes:
      - .:/app
    command: >
      sh -c "python3 scripts/migration/run_migrations.py && python3 scripts/sync/run_scheduled_sync.py"
    restart: always
    environment:
      - SYNC_INTERVAL_MINUTES=10
      - SYNC_PROJECT_KEYS=${SYNC_PROJECT_KEYS:-[]}
      - SYNC_FULL_SYNC=true
      - db_port=5432
      - db_host=postgres
    networks:
      - jira-bot-network

  synth-pm-multi-project-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synth_pm_multi_project
    image: jira_telegram_bot:v3
    volumes:
      - .:/app
    command: >
      python3 scripts/notifications/run_synth_pm_service.py
    restart: always
    environment:
      # Comma-separated project keys or JSON array: ["PROJECT1","PROJECT2"]
      # Leave empty to sync all projects
      - SYNTH_PM_PROJECT_KEYS=
    networks:
      - jira-bot-network

