version: '3.8'

networks:
  jira-bot-network:
    name: jira-telegram-bot-network
    external: true
  


services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram_bot
    image: jira_telegram_bot:v3
    volumes:
      - .:/app
    command: >
      python3 jira_telegram_bot
    restart: always
  
  synth-pm-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: synth_pm_api
    image: jira_telegram_bot:v3
    volumes:
      - .:/app
    command: >
      python3 jira_telegram_bot/frameworks/api/main.py
    restart: always
    ports:
      - "2318:2318"

  ticketing-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketing_bot
    volumes:
      - .:/app
    command: >
      python3 jira_telegram_bot/frameworks/fast_api/create_ticket.py
    restart: always
    ports:
      - "2315:2315"


  jira-sync-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jira_sync_service
    image: jira_telegram_bot:v3
    volumes:
      - .:/app
    command: >
      python3 scripts/run_scheduled_sync.py
    restart: always
    environment:
      - SYNC_INTERVAL_MINUTES=10
      - SYNC_PROJECT_KEYS=["PCT","PARSCHAT"]
      - SYNC_FULL_SYNC=true
      - db_port=5432
      - db_host=postgres
    networks:
      - jira-bot-network

